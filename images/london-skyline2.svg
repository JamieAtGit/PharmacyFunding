    <rect x="87"  y="82"  width="10" height="7" rx="2"/>
    <rect x="123" y="92"  width="10" height="7" rx="2"/>
    <rect x="149" y="119" width="10" height="7" rx="2"/>
    <rect x="159" y="155" width="10" height="7" rx="2"/>
    <rect x="149" y="191" width="10" height="7" rx="2"/>
    <rect x="123" y="217" width="10" height="7" rx="2"/>
    <rect x="87"  y="227" width="10" height="7" rx="2"/>
    <rect x="51"  y="217" width="10" height="7" rx="2"/>
    <rect x="25"  y="191" width="10" height="7" rx="2"/>
    <rect x="15"  y="155" width="10" height="7" rx="2"/>
    <rect x="25"  y="119" width="10" height="7" rx="2"/>
    <rect x="51"  y="92"  width="10" height="7" rx="2"/>
  </g>
</g>

