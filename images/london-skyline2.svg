    <line x1="92" y1="158" x2="56"  y2="220"/>
    <line x1="92" y1="158" x2="30"  y2="194"/>
    <line x1="92" y1="158" x2="20"  y2="158"/>
    <line x1="92" y1="158" x2="30"  y2="122"/>
    <line x1="92" y1="158" x2="56"  y2="96"/>
  </g>
