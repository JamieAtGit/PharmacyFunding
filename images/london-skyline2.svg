<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 280"
     fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
<defs>
  <style>
    @keyframes eye-spin    { to { transform: rotate(360deg); } }
    @keyframes thames-flow { to { transform: translateX(-48px); } }
    @keyframes shard-blink {
      0%, 38%, 62%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    @keyframes gherkin-shimmer {
      0%, 100% { stroke-opacity: .45; }
      50%       { stroke-opacity: .85; }
    }
    @keyframes clock-glow {
      0%, 100% { stroke-opacity: 1; }
      50%       { stroke-opacity: .35; }
    }
    .eye-wheel {
      transform-origin: 92px 158px;
      transform-box: view-box;
      animation: eye-spin 80s linear infinite;
    }
    .thames       { animation: thames-flow 8s linear infinite; }
    .shard-light  { animation: shard-blink 2.6s ease-in-out infinite; }
    .gherkin-grid { animation: gherkin-shimmer 4s ease-in-out infinite alternate; }
    .clock-face   { animation: clock-glow 7s ease-in-out infinite; }
  </style>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="bounds"><rect width="1440" height="280"/></clipPath>
</defs>

<!-- ── THAMES (seamless animated waves) ─────────────────────────────── -->
<g class="thames" clip-path="url(#bounds)">
  <path stroke-width="1.5" stroke-opacity=".45"
    d="M-48,258 Q-24,252 0,258 Q24,264 48,258 Q72,252 96,258 Q120,264 144,258
       Q168,252 192,258 Q216,264 240,258 Q264,252 288,258 Q312,264 336,258
       Q360,252 384,258 Q408,264 432,258 Q456,252 480,258 Q504,264 528,258
       Q552,252 576,258 Q600,264 624,258 Q648,252 672,258 Q696,264 720,258
       Q744,252 768,258 Q792,264 816,258 Q840,252 864,258 Q888,264 912,258
       Q936,252 960,258 Q984,264 1008,258 Q1032,252 1056,258 Q1080,264 1104,258
       Q1128,252 1152,258 Q1176,264 1200,258 Q1224,252 1248,258 Q1272,264 1296,258
       Q1320,252 1344,258 Q1368,264 1392,258 Q1416,252 1440,258 Q1464,264 1488,258"/>
  <path stroke-width=".9" stroke-opacity=".22"
    d="M-48,264 Q-24,259 0,264 Q24,269 48,264 Q72,259 96,264 Q120,269 144,264
       Q168,259 192,264 Q216,269 240,264 Q264,259 288,264 Q312,269 336,264
       Q360,259 384,264 Q408,269 432,264 Q456,259 480,264 Q504,269 528,264
       Q552,259 576,264 Q600,269 624,264 Q648,259 672,264 Q696,269 720,264
       Q744,259 768,264 Q792,269 816,264 Q840,259 864,264 Q888,269 912,264
       Q936,259 960,264 Q984,269 1008,264 Q1032,259 1056,264 Q1080,269 1104,264
       Q1128,259 1152,264 Q1176,269 1200,264 Q1224,259 1248,264 Q1272,269 1296,264
       Q1320,259 1344,264 Q1368,269 1392,264 Q1416,259 1440,264 Q1464,269 1488,264"/>
</g>

<!-- ── LONDON EYE ──────────────────────────────────────────────────── -->
<!-- Fixed: boarding platform + A-frame legs -->
<line x1="68" y1="228" x2="116" y2="228" stroke-width="1.8"/>
<path stroke-width="2.2" d="M68,228 L38,258 M116,228 L146,258"/>
<line x1="38" y1="255" x2="146" y2="255" stroke-width="1.5"/>

